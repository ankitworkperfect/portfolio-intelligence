<!DOCTYPE html>
<html lang="en">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

::selection{background:#2d5bff44}input:focus,textarea:focus{outline:none}button{font-family:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.spinner{width:20px;height:20px;border:2px solid #2d5bff33;border-top-color:#2d5bff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.ai-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ai-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:5px;background:#0a0e1a;font-size:11px}

.ai-card{padding:10px 12px;border-radius:6px;background:#0a0e1a;border:1px solid #1e293b;margin-bottom:6px;font-size:11px}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo} = React;

// ══════════════════════════════════════════════════════════════
// MONDAY.COM API CLIENT
// ══════════════════════════════════════════════════════════════
const PORTFOLIO_BOARD = 5027112477;
const UPDATES_BOARD = 5027112507;

async function mondayQuery(token, query, variables={}) {
  const res = await fetch("https://api.monday.com/v2", {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization": token, "API-Version":"2024-10" },
    body: JSON.stringify({ query, variables })
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

async function fetchPortfolioCompanies(token) {
  const data = await mondayQuery(token, `{
    boards(ids:${PORTFOLIO_BOARD}){
      items_page(limit:25){
        items{
          id name group{title}
          column_values{id type text value}
        }
      }
    }
  }`);
  return data.boards[0].items_page.items.map(item => {
    const cv = {};
    item.column_values.forEach(c => { cv[c.id] = c; });
    const getT = id => cv[id]?.text || "";
    const getN = id => parseFloat(cv[id]?.text) || 0;
    const getDrop = id => { try { const v = JSON.parse(cv[id]?.value || "null"); return v?.labels?.[0] || ""; } catch { return cv[id]?.text || ""; } };
    const getLong = id => { try { const v = JSON.parse(cv[id]?.value || "null"); return v?.text || cv[id]?.text || ""; } catch { return cv[id]?.text || ""; } };
    const getStatus = id => { try { const v = JSON.parse(cv[id]?.value || "null"); return v?.label || cv[id]?.text || ""; } catch { return cv[id]?.text || ""; } };
    return {
      id: item.id, name: item.name, group: item.group?.title || "",
      industry: getDrop("dropdown_mm1arcfb"),
      hq: getT("text_mm1ak3bh"),
      ceo: getT("text_mm1ab788"),
      acquired: getT("date_mm1a75tx"),
      employees: getDrop("dropdown_mm1amt5v"),
      region: getDrop("dropdown_mm1a93rz"),
      desc: getLong("long_text_mm1aqev6"),
      acqPrice: getN("numeric_mm1fjt8a"),
      model: getDrop("dropdown_mm1fsfka"),
      target: getT("text_mm1fp2tn"),
      moat: getT("text_mm1f4b7"),
      thesis: getLong("long_text_mm1fct7k"),
      boardChair: getT("text_mm1fpcd9"),
      priority: getStatus("color_mm1fnjmc"),
      founded: getN("numeric_mm1fxg5a"),
      arrAtAcq: getN("numeric_mm1f7ck5"),
      platform: getT("text_mm1f37k0"),
    };
  });
}

async function fetchMonthlyUpdates(token) {
  const data = await mondayQuery(token, `{
    boards(ids:${UPDATES_BOARD}){
      items_page(limit:100){
        items{
          id name group{title}
          column_values{id type text value}
        }
      }
    }
  }`);
  return data.boards[0].items_page.items.map(item => {
    const cv = {};
    item.column_values.forEach(c => { cv[c.id] = c; });
    const getN = id => parseFloat(cv[id]?.text) || 0;
    const getLong = id => { try { const v = JSON.parse(cv[id]?.value || "null"); return v?.text || cv[id]?.text || ""; } catch { return cv[id]?.text || ""; } };
    const getStatus = id => { try { const v = JSON.parse(cv[id]?.value || "null"); return v?.label || cv[id]?.text || ""; } catch { return cv[id]?.text || ""; } };
    return {
      id: item.id, name: item.name, month: item.group?.title || "",
      company: item.name.replace(/ - (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4}$/, ""),
      arr: getN("numeric_mm1aysez"),
      mrr: getN("numeric_mm1agec5"),
      mrrG: getN("numeric_mm1anh6x"),
      ebitda: getN("numeric_mm1a6vsn"),
      margin: getN("numeric_mm1a6exn"),
      churn: getN("numeric_mm1as61p"),
      hc: getN("numeric_mm1aq68s"),
      cash: getN("numeric_mm1a7t3f"),
      runway: getN("numeric_mm1abyv5"),
      nps: getN("numeric_mm1anjyq"),
      wins: getLong("long_text_mm1afgth"),
      risks: getLong("long_text_mm1anrf7"),
      outlook: getLong("long_text_mm1a5nf"),
      flag: getStatus("color_mm1fzcda"),
    };
  });
}

// ── Helpers ────────────────────────────────────────────────
const fmt=n=>n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${n}`;
const fc=f=>f.includes("Done")||f.includes("Healthy")?"#00c875":f.includes("Working")||f.includes("Watch")?"#fdab3d":"#df2f4a";
const fb=f=>f.includes("Done")||f.includes("Healthy")?"rgba(0,200,117,.08)":f.includes("Working")||f.includes("Watch")?"rgba(253,171,61,.08)":"rgba(223,47,74,.08)";
const pc=p=>p.includes("Working")||p.includes("Growth")?"#2d5bff":p.includes("Done")||p.includes("Optimize")?"#00c875":"#df2f4a";
const flagLabel=f=>f.includes("Done")?"Healthy":f.includes("Working")?"Watch":f.includes("Stuck")?"At Risk":f||"—";
const prioLabel=p=>p.includes("Working")?"Growth":p.includes("Done")?"Optimize":p.includes("Stuck")?"Stabilize":p||"—";

function Spark({data,color="#2d5bff",w=80,h=28}){
  if(!data||data.length<2)return null;
  const mn=Math.min(...data),mx=Math.max(...data),r=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/r)*(h-4)-2}`).join(" ");
  return <svg width={w} height={h}><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

function Bars({data,labels,color="#2d5bff",h=150}){
  const mx=Math.max(...data);
  return <div style={{display:"flex",alignItems:"flex-end",gap:5,height:h,padding:"0 2px"}}>
    {data.map((v,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
      <span style={{fontSize:9,color:"#8892a4",fontFamily:"'DM Mono',monospace"}}>{fmt(v)}</span>
      <div style={{width:"100%",maxWidth:44,borderRadius:4,height:`${(v/mx)*(h-36)}px`,background:`linear-gradient(180deg,${color}dd,${color}66)`,transition:"height .8s cubic-bezier(.34,1.56,.64,1)"}}/>
      <span style={{fontSize:8,color:"#8892a4",fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{labels[i]}</span>
    </div>)}
  </div>;
}

// ══════════════════════════════════════════════════════════════
// AI QUERY ENGINE (operates on live fetched data)
// ══════════════════════════════════════════════════════════════
function buildAI(companies, updates) {
  // Get the most recent month group
  const monthOrder = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const months = [...new Set(updates.map(u=>u.month))].sort((a,b)=>{
    const [mA,yA]=a.split(" "); const [mB,yB]=b.split(" ");
    if(yA!==yB) return parseInt(yA)-parseInt(yB);
    return monthOrder.findIndex(m=>a.includes(m))-monthOrder.findIndex(m=>b.includes(m));
  });
  const latestMonth = months[months.length-1] || "";
  const prevMonth = months.length>1 ? months[months.length-2] : "";
  const firstMonth = months[0] || "";
  const latest = updates.filter(u=>u.month===latestMonth);
  const prev = updates.filter(u=>u.month===prevMonth);
  const first = updates.filter(u=>u.month===firstMonth);

  return function processQuery(q) {
    const l = q.toLowerCase();

    if((l.includes("churn"))&&(l.includes("above")||l.includes("over")||l.includes("high")||l.includes("greater"))){
      const m=l.match(/(\d+(\.\d+)?)/);const t=m?parseFloat(m[1]):3;
      const r=latest.filter(c=>c.churn>t);
      return r.length===0?`No companies have churn above ${t}% in ${latestMonth}.`:`<h3>${r.length} ${r.length===1?"company has":"companies have"} churn above ${t}%</h3><p>${latestMonth}</p><div class="ai-list">${r.map(c=>`<div class="ai-item"><span class="ai-dot" style="background:${fc(c.flag)}"></span><strong>${c.company}</strong>: ${c.churn}% churn <span class="ai-flag" style="color:${fc(c.flag)}">${flagLabel(c.flag)}</span></div>`).join("")}</div>`;
    }
    if(l.includes("total")&&l.includes("arr")||l.includes("portfolio arr")||l.includes("combined arr")){
      const total=latest.reduce((s,c)=>s+c.arr,0);
      return `<h3>Total Portfolio ARR: ${fmt(total)}</h3><p>${latestMonth} · ${latest.length} companies</p><div class="ai-list">${[...latest].sort((a,b)=>b.arr-a.arr).map(c=>`<div class="ai-item"><strong>${c.company}</strong><span class="ai-val">${fmt(c.arr)}</span></div>`).join("")}</div>`;
    }
    if(l.includes("highest margin")||l.includes("best margin")||l.includes("top margin")){
      const s=[...latest].sort((a,b)=>b.margin-a.margin);
      return `<h3>EBITDA Margin Rankings</h3><p>${latestMonth}</p><div class="ai-list">${s.map((c,i)=>`<div class="ai-item"><span class="ai-rank">${i+1}</span><strong>${c.company}</strong><span class="ai-val">${c.margin}%</span></div>`).join("")}</div>`;
    }
    if(l.includes("runway")&&(l.includes("below")||l.includes("under")||l.includes("less")||l.includes("concern"))){
      const m=l.match(/(\d+)/);const t=m?parseInt(m[1]):12;
      const r=latest.filter(c=>c.runway<t);
      return r.length===0?`All companies have runway above ${t} months.`:`<h3>${r.length} ${r.length===1?"company":"companies"} with runway below ${t} months</h3><div class="ai-list">${r.map(c=>`<div class="ai-item"><span class="ai-dot" style="background:${fc(c.flag)}"></span><strong>${c.company}</strong>: ${c.runway}mo, ${fmt(c.cash)} cash <span class="ai-flag" style="color:${fc(c.flag)}">${flagLabel(c.flag)}</span></div>`).join("")}</div><div class="ai-warn">These companies may need capital attention.</div>`;
    }
    if(l.includes("risk")||l.includes("flag")||l.includes("watch")||l.includes("concern")||l.includes("issue")){
      const f=latest.filter(c=>!c.flag.includes("Done")&&!c.flag.includes("Healthy")&&c.flag!=="");
      if(f.length===0) return `<h3>No flagged companies</h3><p>All companies are reporting healthy status in ${latestMonth}.</p>`;
      return `<h3>${f.length} Companies Flagged</h3><p>${latestMonth}</p><div class="ai-list">${f.map(c=>`<div class="ai-card"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="ai-dot" style="background:${fc(c.flag)}"></span><strong>${c.company}</strong><span class="ai-flag" style="color:${fc(c.flag)}">${flagLabel(c.flag)}</span></div><div style="font-size:10px;color:#8892a4">Churn: ${c.churn}% · Runway: ${c.runway}mo · NPS: ${c.nps}</div>${c.risks?`<div style="font-size:10px;color:#fdab3d;margin-top:3px">${c.risks.split("\n")[0]}</div>`:""}</div>`).join("")}</div>`;
    }
    if(l.includes("grow")||l.includes("improv")||l.includes("increase")){
      const g=latest.map(c=>{const j=first.find(x=>x.company===c.company);return{...c,g:j?((c.arr-j.arr)/j.arr*100):0}}).sort((a,b)=>b.g-a.g);
      return `<h3>ARR Growth (${firstMonth} → ${latestMonth})</h3><div class="ai-list">${g.map((c,i)=>`<div class="ai-item"><span class="ai-rank">${i+1}</span><strong>${c.company}</strong><span class="ai-val" style="color:#00c875">+${c.g.toFixed(1)}%</span></div>`).join("")}</div>`;
    }
    if(l.includes("nps")||l.includes("promoter")||l.includes("satisfaction")){
      const s=[...latest].sort((a,b)=>b.nps-a.nps);const avg=(s.reduce((a,c)=>a+c.nps,0)/s.length).toFixed(0);
      return `<h3>NPS Rankings (Avg: ${avg})</h3><div class="ai-list">${s.map((c,i)=>`<div class="ai-item"><span class="ai-rank">${i+1}</span><strong>${c.company}</strong><span class="ai-val">${c.nps}</span></div>`).join("")}</div>`;
    }
    if(l.includes("headcount")||l.includes("employees")||l.includes("team size")||l.includes("people")){
      const t=latest.reduce((s,c)=>s+c.hc,0);
      return `<h3>Total Headcount: ${t}</h3><div class="ai-list">${[...latest].sort((a,b)=>b.hc-a.hc).map(c=>`<div class="ai-item"><strong>${c.company}</strong><span class="ai-val">${c.hc}</span></div>`).join("")}</div>`;
    }
    if(l.includes("acquisition")&&(l.includes("spend")||l.includes("price")||l.includes("cost")||l.includes("total"))){
      const t=companies.reduce((s,c)=>s+c.acqPrice,0);
      return `<h3>Total Acquisition Spend: $${t.toFixed(1)}M</h3><p>${companies.length} companies</p><div class="ai-list">${[...companies].sort((a,b)=>b.acqPrice-a.acqPrice).map(c=>`<div class="ai-item"><strong>${c.name}</strong><span class="ai-val">$${c.acqPrice}M</span></div>`).join("")}</div>`;
    }
    const cm=companies.find(c=>l.includes(c.name.toLowerCase()));
    if(cm){const d=latest.find(c=>c.company===cm.name);if(d)return`<h3>${cm.name}</h3><p>${cm.industry} · ${cm.hq} · CEO: ${cm.ceo}</p><div class="ai-metrics-grid"><div class="ai-metric"><span class="ai-metric-label">ARR</span><span class="ai-metric-val">${fmt(d.arr)}</span></div><div class="ai-metric"><span class="ai-metric-label">EBITDA Margin</span><span class="ai-metric-val">${d.margin}%</span></div><div class="ai-metric"><span class="ai-metric-label">Churn</span><span class="ai-metric-val" style="color:${d.churn>3?"#df2f4a":"#00c875"}">${d.churn}%</span></div><div class="ai-metric"><span class="ai-metric-label">NPS</span><span class="ai-metric-val">${d.nps}</span></div><div class="ai-metric"><span class="ai-metric-label">Runway</span><span class="ai-metric-val">${d.runway}mo</span></div><div class="ai-metric"><span class="ai-metric-label">Status</span><span class="ai-metric-val" style="color:${fc(d.flag)}">${flagLabel(d.flag)}</span></div></div>${d.wins?`<h4 style="color:#00c875;margin:10px 0 4px">Key Wins</h4><div style="font-size:10px;white-space:pre-line;line-height:1.5">${d.wins}</div>`:""}${d.risks?`<h4 style="color:#df2f4a;margin:10px 0 4px">Key Risks</h4><div style="font-size:10px;white-space:pre-line;line-height:1.5">${d.risks}</div>`:""}`;}
    return `<h3>Ask me anything about the portfolio</h3><p>Powered by live monday.com data</p><div class="ai-suggestions"><button onclick="window._aiQ('What is the total portfolio ARR?')">Total portfolio ARR?</button><button onclick="window._aiQ('Which companies have churn above 3%?')">Churn above 3%?</button><button onclick="window._aiQ('Companies with runway below 12 months?')">Low runway?</button><button onclick="window._aiQ('What are the key risks?')">Key risks?</button><button onclick="window._aiQ('Who has the highest margin?')">Best margins?</button><button onclick="window._aiQ('Tell me about Omnitronics')">About Omnitronics</button><button onclick="window._aiQ('Show ARR growth')">ARR growth</button><button onclick="window._aiQ('Total acquisition spend?')">Acquisition spend?</button></div>`;
  };
}

// ══════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════
function App(){
  const [token,setToken]=useState(sessionStorage.getItem("monday_token")||"");
  const [authed,setAuthed]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [companies,setCompanies]=useState([]);
  const [updates,setUpdates]=useState([]);
  const [view,setView]=useState("dashboard");
  const [sel,setSel]=useState(null);
  const [q,setQ]=useState("");
  const [res,setRes]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [lastRefresh,setLastRefresh]=useState(null);

  // ── Data Loading ──────────────────────────────────────────
  const loadData = useCallback(async(t)=>{
    setLoading(true); setError("");
    try{
      const [cos,ups]=await Promise.all([fetchPortfolioCompanies(t),fetchMonthlyUpdates(t)]);
      setCompanies(cos); setUpdates(ups); setAuthed(true);
      sessionStorage.setItem("monday_token",t);
      setLastRefresh(new Date());
    }catch(e){setError(e.message||"Failed to connect");}
    setLoading(false);
  },[]);

  const refresh = ()=> loadData(token);

  // Derived data
  const months = useMemo(()=>{
    const monthOrder=["January","February","March","April","May","June","July","August","September","October","November","December"];
    return [...new Set(updates.map(u=>u.month))].sort((a,b)=>{
      const yA=parseInt(a.match(/\d{4}/)?.[0]||"0"),yB=parseInt(b.match(/\d{4}/)?.[0]||"0");
      if(yA!==yB)return yA-yB;
      return monthOrder.findIndex(m=>a.includes(m))-monthOrder.findIndex(m=>b.includes(m));
    });
  },[updates]);

  const latest=useMemo(()=>updates.filter(u=>u.month===months[months.length-1]),[updates,months]);
  const totalARR=latest.reduce((s,c)=>s+c.arr,0);
  const avgMargin=latest.length?latest.reduce((s,c)=>s+c.margin,0)/latest.length:0;
  const avgChurn=latest.length?latest.reduce((s,c)=>s+c.churn,0)/latest.length:0;
  const totalHC=latest.reduce((s,c)=>s+c.hc,0);
  const flaggedCount=latest.filter(c=>!c.flag.includes("Done")&&!c.flag.includes("Healthy")&&c.flag!=="").length;

  const processQuery = useMemo(()=>buildAI(companies,updates),[companies,updates]);

  // Global handler for suggestion buttons
  window._aiQ = (text)=>{setQ(text);setAiLoading(true);setTimeout(()=>{setRes(processQuery(text));setAiLoading(false);},400);};

  const doQuery=()=>{if(!q.trim())return;setAiLoading(true);setTimeout(()=>{setRes(processQuery(q));setAiLoading(false);},400);};
  const openCo=name=>{setSel(name);setView("company")};

  // ── LOGIN SCREEN ──────────────────────────────────────────
  if(!authed) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div className="fade-up" style={{background:"#111827",borderRadius:16,padding:"40px 36px",border:"1px solid #1e293b",maxWidth:420,width:"100%",textAlign:"center"}}>
      <div style={{width:56,height:56,borderRadius:14,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,margin:"0 auto 16px"}}>SC</div>
      <div style={{fontSize:20,fontWeight:700,letterSpacing:"-.02em",marginBottom:4}}>Portfolio Intelligence</div>
      <div style={{fontSize:12,color:"#8892a4",marginBottom:24}}>Software Combined · Connect to monday.com</div>
      <input value={token} onChange={e=>setToken(e.target.value)} placeholder="Enter monday.com API token"
        type="password" style={{width:"100%",padding:"12px 14px",borderRadius:8,border:"1px solid #1e293b",background:"#0a0e1a",color:"#e2e8f0",fontSize:12,marginBottom:12}}/>
      {error&&<div style={{fontSize:11,color:"#df2f4a",marginBottom:10}}>{error}</div>}
      <button onClick={()=>loadData(token)} disabled={loading||!token} style={{width:"100%",padding:"12px",borderRadius:8,border:"none",background:loading?"#1e293b":"#2d5bff",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>
        {loading?<><span className="spinner" style={{width:14,height:14,marginRight:8,verticalAlign:"middle"}}/> Connecting...</>:"Connect & Load Portfolio"}
      </button>
      <div style={{fontSize:9,color:"#8892a444",marginTop:14}}>Token is stored in session memory only — never saved to disk or transmitted to third parties.</div>
    </div>
  </div>;

  // ── MAIN UI ───────────────────────────────────────────────
  return <div>
    <nav className="glass" style={{padding:"10px 20px",borderBottom:"1px solid #1e293b",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:30,height:30,borderRadius:7,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700}}>SC</div>
        <div><div style={{fontSize:13,fontWeight:700,letterSpacing:"-.02em"}}>Portfolio Intelligence</div>
        <div style={{fontSize:9,color:"#8892a4"}}>Software Combined · {months[months.length-1]||""} · <span style={{color:"#00c875",cursor:"pointer"}} onClick={refresh}>⟳ Live</span></div></div>
      </div>
      <div style={{display:"flex",gap:3}}>
        {[{id:"dashboard",l:"Dashboard"},{id:"companies",l:"Companies"},{id:"query",l:"AI Query"}].map(t=>
          <button key={t.id} onClick={()=>setView(t.id)} style={{padding:"5px 13px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:500,background:view===t.id?"#2d5bff":"transparent",color:view===t.id?"#fff":"#8892a4"}}>{t.l}</button>
        )}
      </div>
    </nav>

    <div style={{maxWidth:1180,margin:"0 auto",padding:"18px 20px"}}>

      {/* DASHBOARD */}
      {view==="dashboard"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:16}}>
          {[{l:"Total ARR",v:fmt(totalARR),s:`${latest.length} companies`,c:"#2d5bff"},{l:"Avg EBITDA Margin",v:avgMargin.toFixed(1)+"%",s:months[months.length-1],c:"#00c875"},{l:"Avg Churn",v:avgChurn.toFixed(1)+"%",s:"Portfolio",c:avgChurn>2.5?"#fdab3d":"#00c875"},{l:"Headcount",v:totalHC+"",s:"All companies",c:"#2d5bff"},{l:"Flagged",v:flaggedCount+"",s:`of ${latest.length}`,c:flaggedCount>0?"#df2f4a":"#00c875"}].map((k,i)=>
            <div key={i} className="fade-up hover-lift" style={{background:"#111827",borderRadius:10,padding:"14px 16px",border:"1px solid #1e293b",animationDelay:`${i*.05}s`}}>
              <div style={{fontSize:9,color:"#8892a4",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>{k.l}</div>
              <div style={{fontSize:22,fontWeight:700,color:k.c,letterSpacing:"-.02em"}}>{k.v}</div>
              <div style={{fontSize:9,color:"#8892a4",marginTop:2}}>{k.s}</div>
            </div>
          )}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          <div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}>
            <div style={{fontSize:12,fontWeight:600,marginBottom:14}}>ARR by Company</div>
            <Bars data={[...latest].sort((a,b)=>b.arr-a.arr).map(c=>c.arr)} labels={[...latest].sort((a,b)=>b.arr-a.arr).map(c=>c.company.split(" ")[0])}/>
          </div>
          <div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}>
            <div style={{fontSize:12,fontWeight:600,marginBottom:10}}>Health Overview</div>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {[...latest].sort((a,b)=>fc(a.flag)==="#df2f4a"?-1:fc(b.flag)==="#df2f4a"?1:fc(a.flag)==="#fdab3d"?-1:1).map((c,i)=>
                <div key={i} onClick={()=>openCo(c.company)} className="hover-lift" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 10px",borderRadius:6,cursor:"pointer",background:fb(c.flag),border:`1px solid ${fc(c.flag)}18`}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:7,height:7,borderRadius:"50%",background:fc(c.flag)}}/><span style={{fontSize:11,fontWeight:500}}>{c.company}</span></div>
                  <div style={{display:"flex",alignItems:"center",gap:14,fontSize:10,color:"#8892a4"}}><span>{fmt(c.arr)}</span><span>{c.churn}%</span><span style={{color:fc(c.flag),fontWeight:600,fontSize:9}}>{flagLabel(c.flag)}</span></div>
                </div>
              )}
            </div>
          </div>
        </div>

        <div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}>
          <div style={{fontSize:12,fontWeight:600,marginBottom:12}}>Trends ({months.length} months)</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
            {latest.map((c,i)=>{
              const t=months.map(m=>updates.find(x=>x.company===c.company&&x.month===m)?.arr||0);
              return <div key={i} onClick={()=>openCo(c.company)} className="hover-lift" style={{padding:"10px 12px",borderRadius:7,cursor:"pointer",border:"1px solid #1e293b",background:"#0a0e1a"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:10,fontWeight:600}}>{c.company}</span><div style={{width:5,height:5,borderRadius:"50%",background:fc(c.flag)}}/></div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}><div><div style={{fontSize:14,fontWeight:700,color:"#2d5bff"}}>{fmt(c.arr)}</div><div style={{fontSize:8,color:"#8892a4"}}>ARR</div></div><Spark data={t} color={t[t.length-1]>t[0]?"#00c875":"#df2f4a"}/></div>
              </div>;
            })}
          </div>
        </div>
      </div>}

      {/* COMPANIES */}
      {view==="companies"&&<div>
        <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>Portfolio Companies ({companies.length})</div>
        {companies.map((c,i)=>{
          const d=latest.find(l=>l.company===c.name);
          const g=d&&c.arrAtAcq?((d.arr-c.arrAtAcq*1e6)/(c.arrAtAcq*1e6)*100):0;
          return <div key={i} onClick={()=>openCo(c.name)} className="fade-up hover-lift" style={{background:"#111827",borderRadius:8,padding:"12px 16px",border:"1px solid #1e293b",cursor:"pointer",display:"grid",gridTemplateColumns:"180px 90px 80px 80px 60px 70px 70px 1fr",alignItems:"center",gap:10,marginBottom:6,animationDelay:`${Math.min(i,.25)*0.05}s`}}>
            <div><div style={{fontSize:12,fontWeight:600}}>{c.name}</div><div style={{fontSize:9,color:"#8892a4"}}>{c.industry} · {c.hq}</div></div>
            <div style={{fontSize:12,fontWeight:600,color:"#2d5bff"}}>{d?fmt(d.arr):"—"}</div>
            <div style={{fontSize:10}}>{d?d.margin+"%":"—"} <span style={{fontSize:8,color:"#8892a4"}}>margin</span></div>
            <div style={{fontSize:10}}>{d?d.churn+"%":"—"} <span style={{fontSize:8,color:"#8892a4"}}>churn</span></div>
            <div style={{fontSize:10}}>{d?d.nps:"—"} <span style={{fontSize:8,color:"#8892a4"}}>NPS</span></div>
            <div style={{fontSize:9,color:pc(c.priority),fontWeight:600,padding:"2px 6px",borderRadius:3,background:pc(c.priority)+"15",textAlign:"center"}}>{prioLabel(c.priority)}</div>
            <div style={{fontSize:9,color:d?fc(d.flag):"#8892a4",fontWeight:600,textAlign:"center"}}>{d?flagLabel(d.flag):"—"}</div>
            <div style={{fontSize:9,color:"#00c875",textAlign:"right"}}>{g>0?`+${g.toFixed(0)}% since acq.`:"—"}</div>
          </div>;
        })}
      </div>}

      {/* COMPANY DETAIL */}
      {view==="company"&&sel&&(()=>{
        const co=companies.find(c=>c.name===sel);
        const d=latest.find(c=>c.company===sel);
        if(!co||!d) return <div>Company not found. <button onClick={()=>setView("dashboard")} style={{background:"none",border:"none",color:"#2d5bff",cursor:"pointer"}}>Go back</button></div>;
        const at=months.map(m=>updates.find(x=>x.company===sel&&x.month===m)?.arr||0);
        const mt=months.map(m=>updates.find(x=>x.company===sel&&x.month===m)?.margin||0);
        const ct=months.map(m=>updates.find(x=>x.company===sel&&x.month===m)?.churn||0);
        return <div>
          <button onClick={()=>setView("dashboard")} style={{background:"none",border:"none",color:"#8892a4",cursor:"pointer",fontSize:11,padding:0,marginBottom:10}}>← Back</button>
          <div className="fade-up" style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}>
            <div style={{width:44,height:44,borderRadius:10,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:700}}>{co.name[0]}</div>
            <div><div style={{fontSize:20,fontWeight:700}}>{co.name}</div><div style={{fontSize:11,color:"#8892a4"}}>{co.industry} · {co.hq} · CEO: {co.ceo} · Chair: {co.boardChair}</div></div>
            <div style={{marginLeft:"auto",display:"flex",gap:6}}>
              <span style={{fontSize:9,padding:"3px 8px",borderRadius:4,background:pc(co.priority)+"20",color:pc(co.priority),fontWeight:600}}>{prioLabel(co.priority)}</span>
              <span style={{fontSize:9,padding:"3px 8px",borderRadius:4,background:fb(d.flag),color:fc(d.flag),fontWeight:600}}>{flagLabel(d.flag)}</span>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}}>
            {[{l:"ARR",v:fmt(d.arr),t:at,c:"#2d5bff"},{l:"EBITDA Margin",v:d.margin+"%",t:mt,c:"#00c875"},{l:"Churn",v:d.churn+"%",t:ct,c:d.churn>3?"#df2f4a":"#00c875"},{l:"NPS",v:d.nps+"",c:d.nps>65?"#00c875":"#fdab3d"},{l:"Runway",v:d.runway+"mo",c:d.runway<12?"#df2f4a":d.runway<18?"#fdab3d":"#00c875"}].map((m,i)=>
              <div key={i} className="fade-up" style={{background:"#111827",borderRadius:7,padding:12,border:"1px solid #1e293b"}}>
                <div style={{fontSize:8,color:"#8892a4",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>{m.l}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}><div style={{fontSize:18,fontWeight:700,color:m.c}}>{m.v}</div>{m.t&&<Spark data={m.t} color={m.c} w={55} h={22}/>}</div>
              </div>
            )}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            <div className="fade-up" style={{background:"#111827",borderRadius:7,padding:14,border:"1px solid #1e293b"}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:8,color:"#00c875"}}>Key Wins</div>
              <div style={{fontSize:10,whiteSpace:"pre-line",lineHeight:1.5}}>{d.wins||"No wins reported."}</div>
            </div>
            <div className="fade-up" style={{background:"#111827",borderRadius:7,padding:14,border:"1px solid #1e293b"}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:8,color:"#df2f4a"}}>Key Risks</div>
              <div style={{fontSize:10,whiteSpace:"pre-line",lineHeight:1.5}}>{d.risks||"No risks reported."}</div>
            </div>
          </div>
          <div className="fade-up" style={{background:"#111827",borderRadius:7,padding:14,border:"1px solid #1e293b"}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:8}}>Investment Profile</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,fontSize:10}}>
              <div><span style={{color:"#8892a4"}}>Acquired:</span> {co.acquired}</div>
              <div><span style={{color:"#8892a4"}}>Price:</span> ${co.acqPrice}M</div>
              <div><span style={{color:"#8892a4"}}>ARR at Acq:</span> ${co.arrAtAcq}M</div>
              <div><span style={{color:"#8892a4"}}>Growth:</span> <span style={{color:"#00c875"}}>+{((d.arr/(co.arrAtAcq*1e6)-1)*100).toFixed(0)}%</span></div>
              <div><span style={{color:"#8892a4"}}>Model:</span> {co.model}</div>
              <div><span style={{color:"#8892a4"}}>Platform:</span> {co.platform}</div>
              <div><span style={{color:"#8892a4"}}>Employees:</span> {co.employees}</div>
              <div><span style={{color:"#8892a4"}}>Moat:</span> {co.moat}</div>
            </div>
          </div>
        </div>;
      })()}

      {/* AI QUERY */}
      {view==="query"&&<div>
        <div className="fade-up" style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:20,fontWeight:700,letterSpacing:"-.02em",marginBottom:4}}>Ask anything about the portfolio</div>
          <div style={{fontSize:11,color:"#8892a4"}}>Live data from monday.com · {companies.length} companies · {months.length} months</div>
        </div>
        <div className="fade-up" style={{display:"flex",gap:6,marginBottom:16,background:"#111827",borderRadius:10,padding:5,border:"1px solid #1e293b"}}>
          <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doQuery()}
            placeholder='Try: "Which companies have churn above 3%?" or "Tell me about Omnitronics"'
            style={{flex:1,background:"transparent",border:"none",color:"#e2e8f0",fontSize:12,padding:"9px 12px"}}/>
          <button onClick={doQuery} disabled={aiLoading} style={{padding:"9px 18px",borderRadius:7,border:"none",cursor:"pointer",background:"#2d5bff",color:"#fff",fontSize:11,fontWeight:600,opacity:aiLoading?.6:1}}>
            {aiLoading?<><span className="spinner" style={{width:12,height:12,marginRight:6,verticalAlign:"middle"}}/>Querying...</>:"Query"}
          </button>
        </div>
        {res?<div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #2d5bff33"}}>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
            <div style={{width:18,height:18,borderRadius:5,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700}}>AI</div>
            <span style={{fontSize:9,color:"#8892a4"}}>Portfolio Intelligence · Live Data</span>
            <span style={{fontSize:8,color:"#00c87566",marginLeft:"auto"}}>● Connected to monday.com</span>
          </div>
          <div dangerouslySetInnerHTML={{__html:res}}/>
        </div>:<div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}><div dangerouslySetInnerHTML={{__html:processQuery("")}}/></div>}
      </div>}
    </div>
  </div>;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
