<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Intelligence | Software Combined</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232d5bff'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='16' font-weight='bold' font-family='sans-serif'>SC</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e2e8f0;font-family:'DM Sans',-apple-system,sans-serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111827}::-webkit-scrollbar-thumb{background:#2d5bff44;border-radius:3px}
::selection{background:#2d5bff44}input:focus,textarea:focus{outline:none}button{font-family:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.fade-up{animation:fadeUp .4s ease-out both}
.hover-lift{transition:all .25s cubic-bezier(.34,1.56,.64,1)}.hover-lift:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.glass{background:rgba(17,24,39,.85);backdrop-filter:blur(16px)}
.spinner{width:20px;height:20px;border:2px solid #2d5bff33;border-top-color:#2d5bff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.thinking span{animation:blink 1.4s infinite both}.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
.ai-md{line-height:1.7;font-size:13px}
.ai-md h1,.ai-md h2,.ai-md h3{color:#e2e8f0;margin:12px 0 6px;font-weight:600}
.ai-md h3{font-size:15px}.ai-md h2{font-size:17px}
.ai-md p{margin:5px 0;color:#c8ceda}.ai-md ul,.ai-md ol{margin:5px 0 5px 18px}.ai-md li{margin:3px 0;color:#c8ceda}
.ai-md strong{color:#e2e8f0}.ai-md em{color:#8892a4}
.ai-md code{background:#1e293b;padding:2px 5px;border-radius:3px;font-family:'DM Mono',monospace;font-size:11px}
.ai-md table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.ai-md th{background:#1e293b;padding:7px 9px;text-align:left;font-weight:600;border-bottom:1px solid #2d5bff33}
.ai-md td{padding:5px 9px;border-bottom:1px solid #1e293b}
.ai-md blockquote{border-left:3px solid #2d5bff;padding:6px 12px;margin:6px 0;background:#2d5bff08;border-radius:0 5px 5px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo} = React;

const SYS = `You are the Portfolio Intelligence AI for Software Combined, a PE firm with a "buy, optimize, hold" strategy for B2B software companies.

You have access to live monday.com data via MCP. Workspace: "Portfolio Intelligence Hub" (ID: 2822531).

Two boards:
1. Portfolio Companies (ID: 5027112477) - Company profiles: Name, Industry, HQ, CEO, Date Acquired, Website, Employee Range, Product Description, Region, Acquisition Price ($M), Business Model, Target Customer, Competitive Moat, Investment Thesis, Board Chair, Strategic Priority, Year Founded, ARR at Acquisition ($M), Key Platform.

2. Monthly Updates (ID: 5027112507) - Monthly metrics: Company (board relation), Report Month, ARR, MRR, MRR Growth %, EBITDA, EBITDA Margin %, Churn Rate %, Headcount, Cash Position, Runway (Months), NPS, Key Wins, Key Risks, Outlook, Health Flag.

Rules:
- ALWAYS query live monday.com data via MCP tools. Never guess numbers.
- Use board_insights for aggregations. Use get_board_items_page with includeColumns:true for details.
- Present data in tables when comparing. Use markdown formatting.
- Provide strategic PE-level analysis, not just data dumps.
- Flag concerning metrics proactively.
- You advise CEO Evert den Hollander (financial focus) and CRO Stefan Jansen (risk/strategy focus).
- Be concise but insightful. Every response should have a "so what" — what should leadership do with this information?`;

async function callClaude(msgs, aKey, mToken) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":aKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",max_tokens:4096,system:SYS,messages:msgs,
      mcp_servers:[{type:"url",url:"https://mcp.monday.com/sse",name:"monday",authorization_token:mToken}]
    })
  });
  if(!r.ok){const e=await r.text();throw new Error(`API ${r.status}: ${e.substring(0,200)}`);}
  const d=await r.json();
  return d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n\n")||"No response.";
}

async function mGQL(t,q){
  const r=await fetch("https://api.monday.com/v2",{method:"POST",headers:{"Content-Type":"application/json","Authorization":t,"API-Version":"2024-10"},body:JSON.stringify({query:q})});
  const j=await r.json();if(j.errors)throw new Error(j.errors[0].message);return j.data;
}

async function loadBoards(t){
  const[c,u]=await Promise.all([
    mGQL(t,`{boards(ids:5027112477){items_page(limit:25){items{id name group{title}column_values{id type text value}}}}}`),
    mGQL(t,`{boards(ids:5027112507){items_page(limit:100){items{id name group{title}column_values{id type text value}}}}}`)
  ]);
  const cos=c.boards[0].items_page.items.map(i=>{const v={};i.column_values.forEach(c=>{v[c.id]=c});const gt=id=>v[id]?.text||"";const gn=id=>parseFloat(v[id]?.text)||0;const gd=id=>{try{return JSON.parse(v[id]?.value||"null")?.labels?.[0]||v[id]?.text||""}catch{return v[id]?.text||""}};const gs=id=>{try{return JSON.parse(v[id]?.value||"null")?.label||v[id]?.text||""}catch{return v[id]?.text||""}};
    return{id:i.id,name:i.name,group:i.group?.title||"",industry:gd("dropdown_mm1arcfb"),hq:gt("text_mm1ak3bh"),ceo:gt("text_mm1ab788"),acquired:gt("date_mm1a75tx"),employees:gd("dropdown_mm1amt5v"),region:gd("dropdown_mm1a93rz"),acqPrice:gn("numeric_mm1fjt8a"),model:gd("dropdown_mm1fsfka"),moat:gt("text_mm1f4b7"),boardChair:gt("text_mm1fpcd9"),priority:gs("color_mm1fnjmc"),arrAtAcq:gn("numeric_mm1f7ck5"),platform:gt("text_mm1f37k0")};
  });
  const ups=u.boards[0].items_page.items.map(i=>{const v={};i.column_values.forEach(c=>{v[c.id]=c});const gn=id=>parseFloat(v[id]?.text)||0;const gs=id=>{try{return JSON.parse(v[id]?.value||"null")?.label||v[id]?.text||""}catch{return v[id]?.text||""}};
    return{id:i.id,name:i.name,month:i.group?.title||"",company:i.name.replace(/ - (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4}$/,""),arr:gn("numeric_mm1aysez"),mrr:gn("numeric_mm1agec5"),mrrG:gn("numeric_mm1anh6x"),ebitda:gn("numeric_mm1a6vsn"),margin:gn("numeric_mm1a6exn"),churn:gn("numeric_mm1as61p"),hc:gn("numeric_mm1aq68s"),cash:gn("numeric_mm1a7t3f"),runway:gn("numeric_mm1abyv5"),nps:gn("numeric_mm1anjyq"),flag:gs("color_mm1fzcda")};
  });
  return{companies:cos,updates:ups};
}

const fmt=n=>n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${n}`;
const fc=f=>f.includes("Done")||f.includes("Healthy")?"#00c875":f.includes("Working")||f.includes("Watch")?"#fdab3d":"#df2f4a";
const fb=f=>f.includes("Done")||f.includes("Healthy")?"rgba(0,200,117,.08)":f.includes("Working")||f.includes("Watch")?"rgba(253,171,61,.08)":"rgba(223,47,74,.08)";
const pc=p=>p.includes("Working")||p.includes("Growth")?"#2d5bff":p.includes("Done")||p.includes("Optimize")?"#00c875":"#df2f4a";
const fl=f=>f.includes("Done")?"Healthy":f.includes("Working")?"Watch":f.includes("Stuck")?"At Risk":f||"—";
const pl=p=>p.includes("Working")?"Growth":p.includes("Done")?"Optimize":p.includes("Stuck")?"Stabilize":p||"—";

function Spark({data,color="#2d5bff",w=80,h=28}){if(!data||data.length<2)return null;const mn=Math.min(...data),mx=Math.max(...data),r=mx-mn||1;return<svg width={w} height={h}><polyline points={data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/r)*(h-4)-2}`).join(" ")} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;}

function Bars({data,labels,color="#2d5bff",h=150}){const mx=Math.max(...data);return<div style={{display:"flex",alignItems:"flex-end",gap:5,height:h,padding:"0 2px"}}>{data.map((v,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><span style={{fontSize:9,color:"#8892a4",fontFamily:"'DM Mono',monospace"}}>{fmt(v)}</span><div style={{width:"100%",maxWidth:44,borderRadius:4,height:`${(v/mx)*(h-36)}px`,background:`linear-gradient(180deg,${color}dd,${color}66)`}}/><span style={{fontSize:8,color:"#8892a4",fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{labels[i]}</span></div>)}</div>;}

function App(){
  const[mt,setMt]=useState(sessionStorage.getItem("mt")||"");
  const[ak,setAk]=useState(sessionStorage.getItem("ak")||"");
  const[authed,setAuthed]=useState(false);
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[cos,setCos]=useState([]);
  const[ups,setUps]=useState([]);
  const[view,setView]=useState("dashboard");
  const[sel,setSel]=useState(null);
  const[msgs,setMsgs]=useState([]);
  const[inp,setInp]=useState("");
  const[aiL,setAiL]=useState(false);
  const chatEnd=useRef(null);

  const load=useCallback(async()=>{setLoading(true);setErr("");try{const d=await loadBoards(mt);setCos(d.companies);setUps(d.updates);setAuthed(true);sessionStorage.setItem("mt",mt);sessionStorage.setItem("ak",ak);}catch(e){setErr(e.message);}setLoading(false);},[mt,ak]);
  const refresh=()=>load();

  const mos=useMemo(()=>{const o=["January","February","March","April","May","June","July","August","September","October","November","December"];return[...new Set(ups.map(u=>u.month))].sort((a,b)=>{const yA=parseInt(a.match(/\d{4}/)?.[0]||"0"),yB=parseInt(b.match(/\d{4}/)?.[0]||"0");if(yA!==yB)return yA-yB;return o.findIndex(m=>a.includes(m))-o.findIndex(m=>b.includes(m));});},[ups]);
  const lat=useMemo(()=>ups.filter(u=>u.month===mos[mos.length-1]),[ups,mos]);
  const tARR=lat.reduce((s,c)=>s+c.arr,0);
  const aM=lat.length?lat.reduce((s,c)=>s+c.margin,0)/lat.length:0;
  const aC=lat.length?lat.reduce((s,c)=>s+c.churn,0)/lat.length:0;
  const tHC=lat.reduce((s,c)=>s+c.hc,0);
  const fC=lat.filter(c=>!c.flag.includes("Done")&&!c.flag.includes("Healthy")&&c.flag!=="").length;

  const send=useCallback(async()=>{if(!inp.trim()||aiL)return;const um={role:"user",content:inp};const nm=[...msgs,um];setMsgs(nm);setInp("");setAiL(true);try{const r=await callClaude(nm.map(m=>({role:m.role,content:m.content})),ak,mt);setMsgs([...nm,{role:"assistant",content:r}]);}catch(e){setMsgs([...nm,{role:"assistant",content:`**Error:** ${e.message}\n\nCheck your API keys and try again.`}]);}setAiL(false);},[inp,msgs,aiL,ak,mt]);

  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:"smooth"})},[msgs,aiL]);
  const openCo=n=>{setSel(n);setView("company")};

  if(!authed)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="fade-up" style={{background:"#111827",borderRadius:16,padding:"40px 36px",border:"1px solid #1e293b",maxWidth:440,width:"100%"}}>
    <div style={{textAlign:"center",marginBottom:24}}><div style={{width:56,height:56,borderRadius:14,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,margin:"0 auto 16px"}}>SC</div><div style={{fontSize:20,fontWeight:700}}>Portfolio Intelligence</div><div style={{fontSize:12,color:"#8892a4",marginTop:4}}>AI-powered by Claude + monday.com</div></div>
    <div style={{marginBottom:12}}><label style={{fontSize:11,color:"#8892a4",display:"block",marginBottom:4}}>monday.com API token</label><input value={mt} onChange={e=>setMt(e.target.value)} placeholder="Paste monday.com token" type="password" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #1e293b",background:"#0a0e1a",color:"#e2e8f0",fontSize:12}}/></div>
    <div style={{marginBottom:16}}><label style={{fontSize:11,color:"#8892a4",display:"block",marginBottom:4}}>Anthropic API key</label><input value={ak} onChange={e=>setAk(e.target.value)} placeholder="sk-ant-api03-..." type="password" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #1e293b",background:"#0a0e1a",color:"#e2e8f0",fontSize:12}}/></div>
    {err&&<div style={{fontSize:11,color:"#df2f4a",marginBottom:10,padding:"8px 10px",background:"#df2f4a11",borderRadius:6}}>{err}</div>}
    <button onClick={load} disabled={loading||!mt||!ak} style={{width:"100%",padding:"12px",borderRadius:8,border:"none",background:loading?"#1e293b":"linear-gradient(135deg,#2d5bff,#7c3aed)",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>{loading?<><span className="spinner" style={{width:14,height:14,marginRight:8,verticalAlign:"middle"}}/>Connecting...</>:"Connect & Launch"}</button>
    <div style={{fontSize:9,color:"#8892a444",marginTop:14,textAlign:"center"}}>Tokens stored in session memory only. Never saved to disk or code.</div>
  </div></div>;

  return<div>
    <nav className="glass" style={{padding:"10px 20px",borderBottom:"1px solid #1e293b",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:30,height:30,borderRadius:7,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700}}>SC</div><div><div style={{fontSize:13,fontWeight:700}}>Portfolio Intelligence</div><div style={{fontSize:9,color:"#8892a4"}}>{mos[mos.length-1]||""} · <span style={{color:"#00c875",cursor:"pointer"}} onClick={refresh}>⟳ Live</span> · Powered by Claude</div></div></div>
      <div style={{display:"flex",gap:3}}>{[{id:"dashboard",l:"Dashboard"},{id:"companies",l:"Companies"},{id:"ai",l:"AI Advisor"}].map(t=><button key={t.id} onClick={()=>setView(t.id)} style={{padding:"5px 13px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:500,background:view===t.id?"#2d5bff":"transparent",color:view===t.id?"#fff":"#8892a4"}}>{t.l}</button>)}</div>
    </nav>

    <div style={{maxWidth:1180,margin:"0 auto",padding:"18px 20px"}}>
      {view==="dashboard"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:16}}>{[{l:"Total ARR",v:fmt(tARR),s:`${lat.length} companies`,c:"#2d5bff"},{l:"Avg EBITDA margin",v:aM.toFixed(1)+"%",s:mos[mos.length-1],c:"#00c875"},{l:"Avg churn",v:aC.toFixed(1)+"%",s:"Portfolio",c:aC>2.5?"#fdab3d":"#00c875"},{l:"Headcount",v:tHC+"",s:"All companies",c:"#2d5bff"},{l:"Flagged",v:fC+"",s:`of ${lat.length}`,c:fC>0?"#df2f4a":"#00c875"}].map((k,i)=><div key={i} className="fade-up hover-lift" style={{background:"#111827",borderRadius:10,padding:"14px 16px",border:"1px solid #1e293b",animationDelay:`${i*.05}s`}}><div style={{fontSize:9,color:"#8892a4",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>{k.l}</div><div style={{fontSize:22,fontWeight:700,color:k.c}}>{k.v}</div><div style={{fontSize:9,color:"#8892a4",marginTop:2}}>{k.s}</div></div>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          <div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}><div style={{fontSize:12,fontWeight:600,marginBottom:14}}>ARR by company</div><Bars data={[...lat].sort((a,b)=>b.arr-a.arr).map(c=>c.arr)} labels={[...lat].sort((a,b)=>b.arr-a.arr).map(c=>c.company.split(" ")[0])}/></div>
          <div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}><div style={{fontSize:12,fontWeight:600,marginBottom:10}}>Health overview</div><div style={{display:"flex",flexDirection:"column",gap:5}}>{[...lat].sort((a,b)=>fc(a.flag)==="#df2f4a"?-1:fc(b.flag)==="#df2f4a"?1:fc(a.flag)==="#fdab3d"?-1:1).map((c,i)=><div key={i} onClick={()=>openCo(c.company)} className="hover-lift" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 10px",borderRadius:6,cursor:"pointer",background:fb(c.flag),border:`1px solid ${fc(c.flag)}18`}}><div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:7,height:7,borderRadius:"50%",background:fc(c.flag)}}/><span style={{fontSize:11,fontWeight:500}}>{c.company}</span></div><div style={{display:"flex",alignItems:"center",gap:14,fontSize:10,color:"#8892a4"}}><span>{fmt(c.arr)}</span><span>{c.churn}%</span><span style={{color:fc(c.flag),fontWeight:600,fontSize:9}}>{fl(c.flag)}</span></div></div>)}</div></div>
        </div>
        <div className="fade-up" style={{background:"#111827",borderRadius:10,padding:18,border:"1px solid #1e293b"}}><div style={{fontSize:12,fontWeight:600,marginBottom:12}}>Trends ({mos.length} months)</div><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>{lat.map((c,i)=>{const t=mos.map(m=>ups.find(x=>x.company===c.company&&x.month===m)?.arr||0);return<div key={i} onClick={()=>openCo(c.company)} className="hover-lift" style={{padding:"10px 12px",borderRadius:7,cursor:"pointer",border:"1px solid #1e293b",background:"#0a0e1a"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:10,fontWeight:600}}>{c.company}</span><div style={{width:5,height:5,borderRadius:"50%",background:fc(c.flag)}}/></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}><div><div style={{fontSize:14,fontWeight:700,color:"#2d5bff"}}>{fmt(c.arr)}</div><div style={{fontSize:8,color:"#8892a4"}}>ARR</div></div><Spark data={t} color={t[t.length-1]>t[0]?"#00c875":"#df2f4a"}/></div></div>})}</div></div>
      </div>}

      {view==="companies"&&<div><div style={{fontSize:17,fontWeight:700,marginBottom:14}}>Portfolio companies ({cos.length})</div>{cos.map((c,i)=>{const d=lat.find(l=>l.company===c.name);const g=d&&c.arrAtAcq?((d.arr-c.arrAtAcq*1e6)/(c.arrAtAcq*1e6)*100):0;return<div key={i} onClick={()=>openCo(c.name)} className="fade-up hover-lift" style={{background:"#111827",borderRadius:8,padding:"12px 16px",border:"1px solid #1e293b",cursor:"pointer",display:"grid",gridTemplateColumns:"180px 90px 80px 80px 60px 70px 70px 1fr",alignItems:"center",gap:10,marginBottom:6}}><div><div style={{fontSize:12,fontWeight:600}}>{c.name}</div><div style={{fontSize:9,color:"#8892a4"}}>{c.industry} · {c.hq}</div></div><div style={{fontSize:12,fontWeight:600,color:"#2d5bff"}}>{d?fmt(d.arr):"—"}</div><div style={{fontSize:10}}>{d?d.margin+"%":"—"} <span style={{fontSize:8,color:"#8892a4"}}>margin</span></div><div style={{fontSize:10}}>{d?d.churn+"%":"—"} <span style={{fontSize:8,color:"#8892a4"}}>churn</span></div><div style={{fontSize:10}}>{d?d.nps:"—"} <span style={{fontSize:8,color:"#8892a4"}}>NPS</span></div><div style={{fontSize:9,color:pc(c.priority),fontWeight:600,padding:"2px 6px",borderRadius:3,background:pc(c.priority)+"15",textAlign:"center"}}>{pl(c.priority)}</div><div style={{fontSize:9,color:d?fc(d.flag):"#8892a4",fontWeight:600,textAlign:"center"}}>{d?fl(d.flag):"—"}</div><div style={{fontSize:9,color:"#00c875",textAlign:"right"}}>{g>0?`+${g.toFixed(0)}% since acq.`:"—"}</div></div>})}</div>}

      {view==="company"&&sel&&(()=>{const co=cos.find(c=>c.name===sel);const d=lat.find(c=>c.company===sel);if(!co||!d)return<div>Not found. <button onClick={()=>setView("dashboard")} style={{background:"none",border:"none",color:"#2d5bff",cursor:"pointer"}}>Back</button></div>;const at=mos.map(m=>ups.find(x=>x.company===sel&&x.month===m)?.arr||0);const mt2=mos.map(m=>ups.find(x=>x.company===sel&&x.month===m)?.margin||0);const ct=mos.map(m=>ups.find(x=>x.company===sel&&x.month===m)?.churn||0);
        return<div><button onClick={()=>setView("dashboard")} style={{background:"none",border:"none",color:"#8892a4",cursor:"pointer",fontSize:11,padding:0,marginBottom:10}}>← Back</button>
        <div className="fade-up" style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}><div style={{width:44,height:44,borderRadius:10,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:700}}>{co.name[0]}</div><div><div style={{fontSize:20,fontWeight:700}}>{co.name}</div><div style={{fontSize:11,color:"#8892a4"}}>{co.industry} · {co.hq} · CEO: {co.ceo} · Chair: {co.boardChair}</div></div><div style={{marginLeft:"auto",display:"flex",gap:6}}><span style={{fontSize:9,padding:"3px 8px",borderRadius:4,background:pc(co.priority)+"20",color:pc(co.priority),fontWeight:600}}>{pl(co.priority)}</span><span style={{fontSize:9,padding:"3px 8px",borderRadius:4,background:fb(d.flag),color:fc(d.flag),fontWeight:600}}>{fl(d.flag)}</span></div></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}}>{[{l:"ARR",v:fmt(d.arr),t:at,c:"#2d5bff"},{l:"EBITDA Margin",v:d.margin+"%",t:mt2,c:"#00c875"},{l:"Churn",v:d.churn+"%",t:ct,c:d.churn>3?"#df2f4a":"#00c875"},{l:"NPS",v:d.nps+"",c:d.nps>65?"#00c875":"#fdab3d"},{l:"Runway",v:d.runway+"mo",c:d.runway<12?"#df2f4a":d.runway<18?"#fdab3d":"#00c875"}].map((m,i)=><div key={i} style={{background:"#111827",borderRadius:7,padding:12,border:"1px solid #1e293b"}}><div style={{fontSize:8,color:"#8892a4",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>{m.l}</div><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}><div style={{fontSize:18,fontWeight:700,color:m.c}}>{m.v}</div>{m.t&&<Spark data={m.t} color={m.c} w={55} h={22}/>}</div></div>)}</div>
        <div style={{background:"#111827",borderRadius:7,padding:14,border:"1px solid #1e293b",marginBottom:14}}><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,fontSize:10}}><div><span style={{color:"#8892a4"}}>Acquired:</span> {co.acquired}</div><div><span style={{color:"#8892a4"}}>Price:</span> ${co.acqPrice}M</div><div><span style={{color:"#8892a4"}}>ARR at Acq:</span> ${co.arrAtAcq}M</div><div><span style={{color:"#8892a4"}}>Growth:</span> <span style={{color:"#00c875"}}>+{((d.arr/(co.arrAtAcq*1e6)-1)*100).toFixed(0)}%</span></div><div><span style={{color:"#8892a4"}}>Model:</span> {co.model}</div><div><span style={{color:"#8892a4"}}>Platform:</span> {co.platform}</div><div><span style={{color:"#8892a4"}}>Employees:</span> {co.employees}</div><div><span style={{color:"#8892a4"}}>Moat:</span> {co.moat}</div></div></div>
        <button onClick={()=>{setView("ai");setInp(`Give me a strategic analysis of ${co.name}: current performance, key risks, and what we should do next.`);}} style={{padding:"8px 16px",borderRadius:6,border:"1px solid #2d5bff33",background:"#2d5bff15",color:"#2d5bff",fontSize:11,fontWeight:600,cursor:"pointer"}}>Ask AI about {co.name} →</button>
      </div>})()}

      {view==="ai"&&<div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 100px)"}}>
        <div style={{textAlign:"center",marginBottom:10}}><div style={{fontSize:18,fontWeight:700,marginBottom:2}}>AI portfolio advisor</div><div style={{fontSize:11,color:"#8892a4"}}>Claude queries live monday.com data via MCP to answer your questions</div></div>
        <div style={{flex:1,overflowY:"auto",marginBottom:10,padding:"0 4px"}}>
          {msgs.length===0&&<div className="fade-up" style={{background:"#111827",borderRadius:12,padding:20,border:"1px solid #1e293b",textAlign:"center"}}><div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Ask anything about the portfolio</div><div style={{fontSize:11,color:"#8892a4",marginBottom:14}}>Claude will query monday.com in real-time and provide strategic analysis</div><div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>{["What's our total portfolio ARR and how has it trended?","Which companies need immediate attention and why?","Compare Omnitronics and Scope Systems","What should we do about Removify's cash situation?","Give me a board-ready portfolio health summary","Which companies have the best growth trajectory?","What are the biggest risks across the portfolio?","Recommend capital allocation priorities for next quarter"].map((q,i)=><button key={i} onClick={()=>setInp(q)} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #1e293b",background:"#0a0e1a",color:"#8892a4",fontSize:10,cursor:"pointer",textAlign:"left"}}>{q}</button>)}</div></div>}
          {msgs.map((m,i)=><div key={i} style={{background:m.role==="user"?"#2d5bff12":"#111827",border:`1px solid ${m.role==="user"?"#2d5bff22":"#1e293b"}`,borderRadius:12,padding:m.role==="user"?"12px 16px":"16px",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>{m.role==="user"?<div style={{width:18,height:18,borderRadius:5,background:"#2d5bff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>U</div>:<div style={{width:18,height:18,borderRadius:5,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>AI</div>}<span style={{fontSize:10,color:"#8892a4"}}>{m.role==="user"?"You":"Portfolio Intelligence AI"}</span>{m.role==="assistant"&&<span style={{fontSize:8,color:"#00c87566",marginLeft:"auto"}}>● Live monday.com data</span>}</div>
            {m.role==="user"?<div style={{fontSize:13}}>{m.content}</div>:<div className="ai-md" dangerouslySetInnerHTML={{__html:marked.parse(m.content)}}/>}
          </div>)}
          {aiL&&<div style={{background:"#111827",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:10}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><div style={{width:18,height:18,borderRadius:5,background:"linear-gradient(135deg,#2d5bff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>AI</div><span style={{fontSize:10,color:"#8892a4"}}>Analyzing...</span></div><div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#8892a4"}}><span className="spinner" style={{width:14,height:14}}/><span>Querying monday.com boards and reasoning over portfolio data</span><span className="thinking"><span>.</span><span>.</span><span>.</span></span></div></div>}
          <div ref={chatEnd}/>
        </div>
        <div style={{display:"flex",gap:6,background:"#111827",borderRadius:12,padding:5,border:"1px solid #1e293b",flexShrink:0}}><input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder='Ask: "What should we do about Removify?" or "Compare ANZ vs European performance"' style={{flex:1,background:"transparent",border:"none",color:"#e2e8f0",fontSize:12,padding:"10px 12px"}}/><button onClick={send} disabled={aiL||!inp.trim()} style={{padding:"10px 20px",borderRadius:8,border:"none",cursor:"pointer",background:aiL?"#1e293b":"linear-gradient(135deg,#2d5bff,#7c3aed)",color:"#fff",fontSize:11,fontWeight:600,opacity:aiL?.6:1}}>{aiL?"Thinking...":"Ask AI"}</button></div>
      </div>}
    </div>
  </div>;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
